<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>TextPilot Updates</title>
    <style>
      :root {
        color: #25342c;
        background: #f4f7f4;
        font-family: system-ui, sans-serif;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
        box-sizing: border-box;
      }
      main {
        width: min(520px, 100%);
        padding: 28px;
        border: 1px solid #dfe7e1;
        border-radius: 16px;
        background: white;
        box-shadow: 0 18px 50px rgba(31, 49, 39, 0.08);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 24px;
      }
      p {
        margin: 0;
        color: #6f7d75;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>TextPilot Updates</h1>
      <p>Служебная страница распространения подписанных обновлений TextPilot.</p>
    </main>
  </body>
</html>
